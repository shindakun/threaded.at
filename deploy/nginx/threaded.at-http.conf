# Port 80: answers Let's Encrypt challenges, redirects everything else to
# HTTPS. Installed first so certbot can issue the certificate that
# threaded.at.conf needs.
server {
    listen 80;
    listen [::]:80;
    server_name threaded.at;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://threaded.at$request_uri;
    }
}
