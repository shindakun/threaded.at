# Port 443. Install after the certificate exists (docs/0002-deploy.md, step 7).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name threaded.at;

    ssl_certificate     /etc/letsencrypt/live/threaded.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/threaded.at/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
