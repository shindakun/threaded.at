[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[package]
name = "threaded"
description = "A link aggregator with atproto identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.8.9"
threaded-core = { version = "0.1.0", path = "crates/core" }
threaded-store = { version = "0.1.0", path = "crates/store" }
threaded-web = { version = "0.1.0", path = "crates/web" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
