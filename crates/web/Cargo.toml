[package]
name = "threaded-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.2.4"
askama = "0.16.1"
axum = "0.8.9"
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
threaded-core = { version = "0.1.0", path = "../core" }
threaded-store = { version = "0.1.0", path = "../store" }
tracing = "0.1.44"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
