[package]
name = "threaded-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ammonia = "4.2.4"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-private", "form"] }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
threaded-auth = { version = "0.1.0", path = "../auth" }
threaded-core = { version = "0.1.0", path = "../core" }
threaded-indexer = { version = "0.1.0", path = "../indexer" }
threaded-store = { version = "0.1.0", path = "../store" }
time = "0.3"
tokio = { version = "1", features = ["time"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
tracing = "0.1.44"

[dev-dependencies]
cookie = { version = "0.18", features = ["private"] }
http-body-util = "0.1.5"
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.27.0"
threaded-auth = { path = "../auth" }
threaded-triage = { path = "../triage" }
tokio = { version = "1.54.1", features = ["rt", "macros"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
