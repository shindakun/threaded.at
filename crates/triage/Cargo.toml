[package]
name = "threaded-triage"
description = "AI triage of new submissions and comments"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
threaded-core = { version = "0.1.0", path = "../core" }
threaded-store = { version = "0.1.0", path = "../store" }
tokio = { version = "1", features = ["time"] }
tracing = "0.1.44"

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
