[package]
name = "threaded-indexer"
description = "Reads at.threaded records from a hydrant indexer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["net", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1.44"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util"] }

[[example]]
name = "hydrant_probe"
